<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Card de Resumo do Pedido</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <img src="images/pattern-background-desktop.svg" alt="pattern-background-desktop" class="Fundo">


  <div class="borda-branca">
    <div class="card">

      <img src="images/illustration-hero.svg" alt="illustration-hero" class="minha-imagem">

      <h1 class="h1">Order Summary</h1>
      <p class="p1">You can now listen to millions of songs,<br> audiobooks, and podcasts on any
        device<br>anywhere you like!</p>
<div class="card2">
      <img src="images/icon-music.svg" alt="icon-music" class="icone-musica">
      <h2>Annual Plan</h2> 
      <p>$59.99/year</p>
      <a href="#">Change</a>
</div>

      <button class="btn-pagamento" type="button" onclick="pagara()">Proceed to Payment</button>
     
       <button class="btn-cancelar" type="button" onclick="cancelar()">Cancel Order</button>


   </div> 
 </div> 







</body>

</html>
